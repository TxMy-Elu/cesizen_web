version: 2
updates:

  # Dépendances npm (front Next.js)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "web"
    ignore:
      # Composants shadcn/ui calés sur une version précise : les MAJEURES
      # changent l'API (ex : react-day-picker 9→10 renomme les classNames et
      # casse components/ui/calendar.tsx). On garde patches + mineures, on migre
      # les majeures à la main en régénérant le composant shadcn.
      - dependency-name: "react-day-picker"
        update-types: ["version-update:semver-major"]
    groups:
      # React et ses types doivent monter ensemble
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Next.js et son plugin ESLint
      next:
        patterns:
          - "next"
          - "eslint-config-next"

  # GitHub Actions (versions des actions utilisées)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
