name: CI — cesizen_web

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - dev

jobs:

  # ── Lint + Build ────────────────────────────────────────────────────────────
  build:
    name: Lint & Build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pas de version ici : pnpm/action-setup lit le champ "packageManager"
      # de package.json (pnpm@10.19.0), qui fait foi pour local ET CI.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Valeurs factices : le build a besoin que ces variables soient définies,
          # mais aucun appel réseau n'est fait à la compilation (SSG/SSR au runtime).
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-key
