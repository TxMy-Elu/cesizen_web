name: 🐛 Bug
description: Signaler un dysfonctionnement du front CESIZen
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Aller sur la page ...
        2. Cliquer sur ...
        3. Observer ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
      description: Message d'erreur, capture, log de la console navigateur.
      render: text
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options:
        - Local (pnpm dev)
        - Preview Vercel
        - Production
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Navigateur
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Mobile
        - Autre
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Criticité
      options:
        - Bloquant (page inutilisable / faille de sécurité)
        - Majeur (fonctionnalité cassée)
        - Mineur (contournement possible)
        - Cosmétique
    validations:
      required: true
