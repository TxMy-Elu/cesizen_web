name: ❓ Question
description: Demander une clarification sur le front, l'intégration API ou le déploiement
title: "[Question] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Formule ta question de façon autonome — sans contexte extérieur.
    validations:
      required: true

  - type: textarea
    id: contexte
    attributes:
      label: Contexte
      description: Ce que tu as déjà tenté, lu ou consulté.
    validations:
      required: false

  - type: dropdown
    id: domaine
    attributes:
      label: Domaine
      options:
        - Next.js / React
        - Intégration API
        - Supabase
        - Déploiement / Vercel
        - Sécurité (CSP, en-têtes)
    validations:
      required: true

  - type: checkboxes
    id: verifications
    attributes:
      label: Vérifications préalables
      options:
        - label: J'ai consulté le dossier `docs/` du repo
          required: true
        - label: J'ai cherché parmi les issues existantes (ouvertes et fermées)
          required: true
